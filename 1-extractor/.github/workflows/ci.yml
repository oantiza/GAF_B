name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Contratos sincronizados con el SSOT
        # En CI no esta la plataforma delante: verifica la copia local contra su
        # propio manifiesto de SHA-256.
        run: python tools/sync_contratos.py --check
      - name: Run tests
        run: python -m pytest
